<title>EnCORE Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: top bar (merk, klantkeuze, tabs) boven één werkkolom; kaarten per taak, tabellen scrollen in hun eigen kader */
:root{
  --bg:#F5F4F1;--panel:#FFFFFF;--ink:#1D1B19;--muted:#6E6963;--line:#E4E0DA;--line-strong:#CFCAC2;
  --accent:#E25F23;--accent-ink:#FFFFFF;--accent-soft:#FCE8DD;--input:#FFFFFF;
  --ok:#2C7A4B;--ok-soft:#E2F1E7;--warn:#A86400;--warn-soft:#FFF0D4;--bad:#BF3A2B;--bad-soft:#FBE2DE;
  --int:#E25F23;--acc:#3D6E9E;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312;--panel:#1E1C1A;--ink:#F1EEE9;--muted:#A49F98;--line:#33302C;--line-strong:#4A4641;
  --accent:#F2783F;--accent-ink:#1A0F08;--accent-soft:#3A2216;--input:#171615;
  --ok:#5DC48C;--ok-soft:#1B3125;--warn:#E8A646;--warn-soft:#382B15;--bad:#F06F61;--bad-soft:#3C1E1A;
  --int:#F2783F;--acc:#79A9D6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312;--panel:#1E1C1A;--ink:#F1EEE9;--muted:#A49F98;--line:#33302C;--line-strong:#4A4641;
  --accent:#F2783F;--accent-ink:#1A0F08;--accent-soft:#3A2216;--input:#171615;
  --ok:#5DC48C;--ok-soft:#1B3125;--warn:#E8A646;--warn-soft:#382B15;--bad:#F06F61;--bad-soft:#3C1E1A;
  --int:#F2783F;--acc:#79A9D6;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{max-width:78rem;margin-inline:auto;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent);font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-top:2px}
.client-pick{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.client-pick label{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:17px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
.grid-tight{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr))}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .d{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:64px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.form .wide{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
td input,td select{width:100%}
td input.n{width:5.2rem;text-align:right}
td input.xs{width:3.6rem;text-align:right}
.muted{color:var(--muted)}
.small{font-size:13px}
.client-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.client-card:hover{border-color:var(--accent)}
.client-card .name{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.anchor{display:flex;flex-direction:column;gap:6px}
.anchor .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.anchor .nm{font-weight:600;font-size:14px}
.anchor .val{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.spark{width:100%;height:38px;display:block}
.ex-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.ex-card .head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.ex-card .title{font-weight:600;font-size:16px}
.ex-card .code{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:18px;min-width:2ch}
.target{font-size:13px;color:var(--muted)}
.prev{font-size:13px;background:var(--bg);border-radius:7px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prev b{font-weight:600}
.sig-up{color:var(--ok);font-weight:600}
.sig-bad{color:var(--bad);font-weight:600}
.blocks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.blockchip{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:5.6rem;font:inherit}
.blockchip .c{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.blockchip .dd{font-size:11.5px;color:var(--muted)}
.blockchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chart{position:relative;min-height:240px}
.chart svg{display:block;width:100%}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-width:16rem;z-index:5}
.tip .t{color:var(--muted)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.confirm .card{max-width:26rem;width:100%}
.countdown{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.station-run td{color:var(--muted)}
.sticky-actions{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:10}
details>summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.checklist{display:grid;gap:6px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.checklist label{display:flex;gap:8px;align-items:center;font-size:14px}
.setgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));margin-top:6px}
.setcell{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.setcell input.xs{width:3.8rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* reeksen: elke reeks een eigen kleur, elke oefening een duidelijk afgebakende kaart */
:root{--rkA:#E25F23;--rkB:#3D6E9E;--rkC:#2C7A4B;--rkF:#8A7F74;--rkX:#B5AEA5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rkA:#F2783F;--rkB:#79A9D6;--rkC:#5DC48C;--rkF:#A49F98;--rkX:#5A5550}}
:root[data-theme="dark"]{--rkA:#F2783F;--rkB:#79A9D6;--rkC:#5DC48C;--rkF:#A49F98;--rkX:#5A5550}
[data-rk="A"]{--rk:var(--rkA)}[data-rk="B"]{--rk:var(--rkB)}[data-rk="C"]{--rk:var(--rkC)}[data-rk="F"]{--rk:var(--rkF)}[data-rk="X"]{--rk:var(--rkX)}
.ex-list{display:flex;flex-direction:column;gap:14px}
.ex-card{border:1px solid var(--line-strong);border-left:6px solid var(--rk,var(--line-strong));padding:14px 16px;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ex-card .head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.ex-card .code{color:var(--rk,var(--accent))}
.reeks-h{display:flex;align-items:center;gap:10px;margin:10px 0 -2px;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rk)}
.reeks-h::after{content:"";flex:1;height:2px;background:var(--rk);opacity:.35}
.slot{display:flex;flex-direction:column;gap:12px}
.slot-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 16px}
.slot-h h2{color:var(--bg)}
.slot-h .small{color:var(--bg);opacity:.75}
.slotgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.slotbtn{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.slotbtn:hover{border-color:var(--accent)}
.slotbtn.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slotbtn .nm{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px;justify-content:space-between}
.slotbtn:disabled{opacity:.5;cursor:not-allowed}
.gen{border:2px solid var(--accent)}
.wu-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.wucell{display:inline-flex;align-items:center;gap:3px;border:1px dashed var(--line-strong);border-radius:7px;padding:3px 5px}
.wucell input.xs{width:3.4rem;padding:4px 6px}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.barwrap{background:var(--line);border-radius:5px;height:10px;min-width:5rem;overflow:hidden}
.bar{height:100%;background:var(--accent);border-radius:5px}
.bar.done{background:var(--acc)}
.kpi .pill{align-self:flex-start;margin-top:6px}
#report-modal .card{max-height:90vh;overflow:auto}
.exfb{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 9rem;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:560px){.exfb{grid-template-columns:1fr}}
.hint{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13.5px}
@media (max-width:560px){h1{font-size:25px}.countdown{font-size:48px}.client-pick{margin-left:0;width:100%}.client-pick select{flex:1}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
/* v1.0.1: on a phone the info pills (adaptation, TUT) wrap instead of pushing the page sideways */
@media (max-width:560px){.pill{white-space:normal;max-width:100%}}

/* ===== tokens.css: BuMa UX standard (U2, U7, U8, U9). Loaded after styles.css, so it wins.
   Rule: colours and sizes come from these variables; no loose colour codes in new code.
   Brand orange (--accent) stays for lines, surfaces and the logo; text and filled buttons use --accent-text. */
:root{
  --accent-text:#B8461B;   /* 5,3:1 on white: text, codes, primary button with white text */
  --warn-text:#8F5500;     /* 5,4:1 on --warn-soft */
  --rkA-text:#B8461B; --rkF-text:#6E6963;
  --tap:44px;              /* minimum touch target on touch screens */
  --input-font:16px;       /* below 16 px iPhone and iPad zoom in on every tap */
  --text-min:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--heat:#B8461B;--accent-text:var(--accent);--warn-text:var(--warn);--rkA-text:var(--rkA);--rkF-text:var(--rkF)}}
:root[data-theme="dark"]{--heat:#B8461B;--accent-text:var(--accent);--warn-text:var(--warn);--rkA-text:var(--rkA);--rkF-text:var(--rkF)}

/* U2 contrast */
.btn.primary{background:var(--accent-text);border-color:var(--accent-text)}
.pill.acc,.ex-card .code{color:var(--accent-text)}
[data-rk]{--rk-text:var(--rk)}
[data-rk="A"]{--rk-text:var(--rkA-text)}
[data-rk="F"],[data-rk="X"]{--rk-text:var(--rkF-text)}
.ex-card .code,.reeks-h{color:var(--rk-text,var(--accent-text))}
.pill.warn,.notice{color:var(--warn-text)}

/* U9 nothing under 12 px */
.brand small,.blockchip .dd,.chart text{font-size:var(--text-min)}

/* U7 + U8 touch screens: 44 px targets, 16 px input text */
@media (pointer:coarse){
  .btn,.tab,.chipbtn,summary,select,input:not([type=checkbox]):not([type=radio]),textarea{min-height:var(--tap)}
  .btn,.chipbtn{min-width:var(--tap);justify-content:center}
  .chipbtn{padding-inline:14px}
  .btn.small{padding-block:10px}
  input,select,textarea{font-size:var(--input-font)}
  input[type=checkbox],input[type=radio]{width:24px;height:24px}
}
</style>

<div class="app" id="app"><div class="top"><div class="top-row"><div class="brand"><b>EnCORE</b> Coach<small>Personal coaching logboek</small></div></div></div><main><div class="empty">De app laadt de klanten, schema's en trainingen…</div></main></div>
<p class="ver" style="text-align:center;font-size:12px;color:#8a857e;margin:8px 0 28px">EnCORE Coach v1.1.0</p>
<div id="overlay"></div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const nl = (v, d = 1) => (v == null || v === '' || !Number.isFinite(Number(v))) ? '' : Number(v).toLocaleString('nl-BE', { maximumFractionDigits: d });
  const pad = (n) => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const toDate = (s) => new Date(s + 'T00:00:00');
  const fmtDate = (s, y = true) => s ? toDate(s).toLocaleDateString('nl-BE', y ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' }) : '';
  const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
  const uid = (p) => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const slug = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'x';
  const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
  const STRENGTH = ['kg', 'kg per hand', 'blok', 'bw'];
  const UNITS_K = [['kg', 'kg'], ['kg per hand', 'kg per hand'], ['blok', 'toestel: blok + extra kg'], ['bw', 'lichaamsgewicht + extra kg']];
  const UNITS_C = [['meter', 'afstand (meter)'], ['sec', 'tijd (seconden)'], ['kcal', 'kcal'], ['watt', 'watt'], ['reps', 'herhalingen']];
  const UNITS = [...UNITS_K, ...UNITS_C];
  const CATS = ['Quadriceps', 'Hamstrings', 'Gluteus', 'Adductoren', 'Kuiten', 'Borst', 'Schouders', 'Bovenrug', 'Onderrug', 'Trapezius', 'Biceps', 'Triceps', 'Voorarmen', 'Core', 'Fullbody', 'Conditie'];
  // Fullbody = Olympische varianten (snatch, clean & jerk): geen klassieke krachttraining, telt niet mee in volume per spiergroep
  const NON_MUSCLE = ['Conditie', 'Fullbody'];

      <label class="field"><span>5. Filler tijdens de rust (optioneel)</span><input id="br-${ri}-filler" list="filler-list" data-bind="brow" data-ri="${ri}" data-f="filler" value="${esc(r.filler ?? '')}" placeholder="bv. band pull-apart 3 × 12"></label>`}
      <div class="small">${prev ? `Vorige keer <b>${esc(fmtDate(prev.date, false))}</b>: ${esc(prev.text)}` : '<span class="muted">Nog niet eerder gelogd.</span>'}</div>

  }
  function viewPlanning() {
    const t = todayStr(), cur = blockFor(t), all = sortedBlocks();

    if (!S.blockSel || !S.blocks[S.blockSel]) S.blockSel = cur?.id || all[all.length - 1]?.id || null;
    if (S.blockSel && (!S.schemaDraft || S.schemaDraft.id !== S.blockSel) && !S.schemaDirty) {
      const src = S.blocks[S.blockSel]; S.schemaDraft = clone(src);
      if (S.schemaDraft) (S.schemaDraft.exercises || []).forEach((r) => { r.day = normDay(src, r.day); r.setPlan = rowPlan(r); });
    }
    const old = S.blockSel && !shown.some((b) => b.id === S.blockSel) ? S.blocks[S.blockSel] : null;
    const chips = [...shown, ...(old ? [old] : [])].map((b) => `<button class="blockchip" data-act="sel-block" data-id="${esc(b.id)}" aria-pressed="${b.id === S.blockSel}"><span class="c"><i class="dot" style="background:${phaseCol(b.phase)}"></i>${esc(b.code)}${cur && b.id === cur.id ? ' <span class="pill acc" style="font-family:var(--f-body)">nu</span>' : ''}</span><span class="dd">${esc(fmtDate(b.start, false))} · ${blockWeeks(b)} weken · ${slotsOf(b).length}× p/w</span></button>`).join('');
    const d = S.schemaDraft;

        }).join('');
        return `<section class="slot"><div class="slot-h"><h2>${esc(title)}</h2><span class="small">${items.length} oefeningen</span></div>
          ${slot && !items.length ? `<div class="empty">Nog leeg. <button class="btn primary small" data-act="gen-slot" data-slot="${slot}">Maak voorstel voor ${esc(slotLabel(slot))}</button></div>` : ''}

      };
      const sections = slots.filter((sl) => !S.slotFilter || S.slotFilter === sl).map((sl) => section(sl, rows.filter((x) => x.r.day === sl), slotLabel(sl))).join('');
      const orphan = rows.filter((x) => !slots.includes(x.r.day));
      const isOld = cur && d.start < cur.start && !S.blocks[d.id]?._unsaved;
      body = `${isOld ? `<div class="notice">Dit is een afgesloten periode uit de historiek.</div>` : ''}
        <section class="card"><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr))">
          <label class="field"><span>Code</span><input id="bm-code" data-bind="bmeta" data-f="code" value="${esc(d.code)}"></label>
          <label class="field"><span>Fase</span><select id="bm-phase" data-bind="bmeta" data-f="phase">${PHASES.map((p) => `<option${p === phaseOf(d.phase) ? ' selected' : ''}>${p}</option>`).join('')}</select></label>
          <label class="field"><span>Start</span><input type="date" id="bm-start" data-bind="bmeta" data-f="start" value="${esc(d.start)}"></label>
          <label class="field"><span>Weken</span><input id="bm-weeks" class="xs" inputmode="numeric" data-bind="bmeta" data-f="weeks" value="${esc(d.weeks ?? 3)}"></label>
          <label class="field"><span>Trainingen per week</span><select id="bm-pw" data-bind="bmeta" data-f="perWeek">${[1, 2, 3, 4, 5].map((n) => `<option${n === slots.length ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
          <label class="field"><span>Rep range</span><input id="bm-reps" data-bind="bmeta" data-f="reps" value="${esc(d.reps ?? '')}" placeholder="8-10"></label>
          <label class="field"><span>Intensiteit (%)</span><input id="bm-int" inputmode="numeric" data-bind="bmeta" data-f="intensity" value="${esc(d.intensity ?? '')}"></label>
          <label class="field wide"><span>Doel</span><input id="bm-goal" data-bind="bmeta" data-f="goal" value="${esc(d.goal ?? '')}"></label></div></section>
        ${slots.length > 1 ? `<div class="chips"><button class="chipbtn" data-act="slot-filter" data-v="" aria-pressed="${!S.slotFilter}">Alle trainingen</button>${slots.map((sl) => `<button class="chipbtn" data-act="slot-filter" data-v="${sl}" aria-pressed="${S.slotFilter === sl}">${slotLabel(sl)}</button>`).join('')}</div>` : ''}
        ${sections}${orphan.length ? section('', orphan, 'Niet ingedeeld') : ''}
        <div class="sticky-actions"><span class="small muted" id="save-state" style="margin-right:auto;align-self:center">${esc(S.saveState || 'Wijzigingen worden automatisch bewaard')}</span><button class="btn danger" data-act="del-block">Periode verwijderen</button></div>`;
    }
    return `<section class="card"><div class="card-h"><div><h2>Planning</h2><p class="sub">Lopende en komende periodes. Oudere periodes staan in Historiek.</p></div>
        <button class="btn primary" data-act="gen-open"${S.canWrite && !S.gen ? '' : ' disabled'}>+ Nieuwe periode opbouwen</button></div>
        <div class="blocks">${chips || '<span class="muted">Nog geen periodes.</span>'}</div></section>
      ${S.gen ? genCard() : ''}${body}<datalist id="filler-list">${FILLERS.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>`;
  }

  // ---------- krachtbalans bovenlichaam ----------
  function balanceCard(c) {
    if (!S.exercises[RATIO_REF]) return '';
    const na = c.anchorsNA || [];
    const rows = RATIOS.filter(([id]) => S.exercises[id] && !na.includes(id)).map(([id, pct]) => ({ id, pct, rm: curRM(id) }));
    const ref = curRM(RATIO_REF);
    const missing = RATIOS.filter(([id]) => !S.exercises[id]).map(([id]) => id);
    let body;
    if (!ref) body = '<p class="notice">Nog geen 1RM voor Flat BB bench press: de referentie (100%) ontbreekt. Log een zware set of vul de intake aan.</p>';
    else {
      rows.forEach((r) => { if (r.rm != null && r.id !== RATIO_REF) { r.act = (r.rm / ref) * 100; r.diff = r.act - r.pct; } });
      const sig = (r) => r.id === RATIO_REF ? ['Referentie', 'neutral'] : r.rm == null ? ['Geen data', 'neutral'] : r.diff <= -10 ? ['Achterstand', 'bad'] : r.diff < -5 ? ['Licht achter', 'warn'] : r.diff > 5 ? ['Voor op bench', 'acc'] : ['In balans', 'ok'];
      const weak = rows.filter((r) => r.diff != null && r.diff < -5).sort((a, b) => a.diff - b.diff)[0];
      const ahead = rows.filter((r) => r.diff != null && r.diff > 5);
      body = `<div class="tablewrap"><table><thead><tr><th>Oefening</th><th class="num">Optimaal</th><th class="num">Doel 1RM</th><th class="num">Huidig e1RM</th><th class="num">Huidig %</th><th class="num">Verschil</th><th>Signaal</th></tr></thead><tbody>${rows.map((r) => { const s = sig(r); return `<tr><td><b style="font-weight:600">${esc(exName(r.id))}</b>${unitOf(r.id) === 'bw' ? ' <span class="small muted">(LG + extra)</span>' : ''}</td><td class="num">${r.pct}%</td><td class="num">${nl(Math.round(ref * r.pct / 100), 0)} kg</td><td class="num">${r.rm != null ? nl(r.rm, 0) + ' kg' : ''}</td><td class="num">${r.act != null ? nl(r.act, 0) + '%' : r.id === RATIO_REF ? '100%' : ''}</td><td class="num">${r.diff != null ? (r.diff >= 0 ? '+' : '-') + nl(Math.abs(r.diff), 0) + ' pt' : ''}</td><td><span class="pill ${s[1]}">${s[0]}</span></td></tr>`; }).join('')}</tbody></table></div>
        ${weak ? `<p class="notice" style="margin-top:10px">Zwakste schakel: <b>${esc(exName(weak.id))}</b> (${nl(Math.abs(weak.diff), 0)} procentpunt onder optimaal, doel ${nl(Math.round(ref * weak.pct / 100), 0)} kg). Geef deze oefening voorrang in de A-reeks.</p>` : rows.some((r) => r.diff != null) ? '<p class="hint" style="margin-top:10px">Geen achterstand t.o.v. de bench press.</p>' : ''}
        ${ahead.length >= 2 ? '<p class="small muted" style="margin:8px 0 0">Meerdere oefeningen liggen voor op de bench press: dan is de bench zelf de achterblijver.</p>' : ''}`;
    }
    return `<section class="card"><div class="card-h"><div><h2>Krachtbalans bovenlichaam</h2><p class="sub">Optimale verhouding t.o.v. Flat BB bench press (= 100%), op basis van e1RM. Signaal: tot 5 procentpunt eronder = in balans, vanaf 10 = achterstand. Zonder eigen meting gebruikt de planning deze ratio als 1RM-basis.</p></div></div>${body}${missing.length ? `<p class="small muted" style="margin:8px 0 0">Niet in de bibliotheek: ${esc(missing.join(', '))}.</p>` : ''}</section>`;
  }

  // ---------- view: progress ----------
  function viewProgress() {
    const c = client(), anchors = clientAnchors(c);
    const others = Object.values(S.exercises).filter((e) => !anchors.includes(e.id) && isStrength(e.id) && history(e.id).some((p) => p.bestP != null)).sort((a, b) => a.name.localeCompare(b.name));
    if (!S.progEx || !(anchors.includes(S.progEx) || others.some((e) => e.id === S.progEx))) S.progEx = anchors.find((id) => anchorStats(id)) || anchors[0] || null;
    const st = S.progEx ? anchorStats(S.progEx) : null;
    const hist = S.progEx ? history(S.progEx).filter((p) => p.bestP != null).reverse() : [];
    const table = anchors.map((id) => { const a = anchorStats(id); return `<tr class="click" data-act="sel-prog" data-id="${esc(id)}"><td><b style="font-weight:600">${esc(exName(id))}</b></td><td class="num">${intakeRM(id) ? nl(intakeRM(id), 0) : ''}</td><td class="num">${a ? nl(a.first, 0) : ''}</td><td class="num">${a ? nl(a.lastStrength, 0) : ''}</td><td class="small">${a ? esc(fmtDate(a.lastDate, false)) : ''}</td><td class="num">${a ? nl(a.best, 0) : ''}</td><td class="num ${a && a.rel.length > 1 && a.delta >= 0.03 ? 'sig-up' : a && a.rel.length > 1 && a.delta <= -0.03 ? 'sig-bad' : ''}">${a && a.rel.length > 1 ? (a.delta >= 0 ? '+' : '−') + nl(Math.abs(a.delta * 100), 0) + '%' : ''}</td><td>${a ? `<span class="pill ${a.signal[1]}">${a.signal[0]}</span>` : '<span class="muted small">nog nooit gelogd</span>'}</td></tr>`; }).join('');
    return `<section class="card"><div class="card-h"><div><h2>Ankeroefeningen</h2><p class="sub">Alles in <b>geschat 1RM (e1RM)</b>, niet het gewicht op de stang: zo zijn een set van 3 en een set van 8 vergelijkbaar. Formule: %-tabel van Stijn, reps + RIR. Trend en signaal tellen enkel <b>zware sets</b> (reps + RIR tot 10). Volumesets zonder RIR onderschatten het 1RM en staan als open bolletje.</p></div></div>
      ${anchors.length ? `<div class="tablewrap"><table><thead><tr><th>Oefening</th><th class="num">Intake</th><th class="num">Eerste</th><th class="num">Laatste</th><th>Gemeten</th><th class="num">Beste</th><th class="num">Verschil</th><th>Signaal</th></tr></thead><tbody>${table}</tbody></table></div>` : '<div class="empty">Geen ankeroefeningen van toepassing voor deze klant.</div>'}</section>
      ${balanceCard(c)}
      <section class="card"><div class="card-h"><div style="display:flex;flex-direction:column;gap:8px"><div class="chips">${anchors.map((id) => `<button class="chipbtn" data-act="sel-prog" data-id="${esc(id)}" aria-pressed="${id === S.progEx}">${esc(exName(id))}${anchorStats(id) ? '' : ' · geen data'}</button>`).join('')}</div>${others.length ? `<div class="chips"><span class="small muted" style="align-self:center">Andere gelogde oefeningen:</span>${others.map((e) => `<button class="chipbtn" data-act="sel-prog" data-id="${esc(e.id)}" aria-pressed="${e.id === S.progEx}" style="font-weight:500">${esc(e.name)}</button>`).join('')}</div>` : ''}</div></div>
        ${st ? `<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>${esc(exName(S.progEx))} · e1RM</h3><div class="legend"><span><i class="dot" style="background:var(--int)"></i>Intensificatie</span><span><i class="dot" style="background:var(--acc)"></i>Accumulatie</span><span><i class="dot" style="background:var(--ok)"></i>Herstel</span><span><i class="dot" style="background:var(--warn)"></i>Test</span><span><i class="dot" style="background:transparent;border:1.5px solid var(--muted)"></i>Volumeset (indicatief)</span><span><i style="display:inline-block;width:14px;border-top:1px dashed var(--muted)"></i>Eerste zware meting</span></div></div>
          ${st.onlyIndicative ? '<p class="notice">Nog geen zware set gelogd: de lijn toont voorlopig volumesets en onderschat het 1RM.</p>' : ''}<div class="chart" id="prog-chart"></div>` : '<div class="empty">Nog geen gegevens voor deze ankeroefening.</div>'}</section>
      ${hist.length ? `<details class="card"><summary>Alle metingen ${esc(exName(S.progEx))}</summary><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Datum</th><th>Periode</th><th>Variant</th><th>Sets</th><th class="num">e1RM</th><th>Soort</th></tr></thead><tbody>${hist.map((p) => `<tr><td>${esc(fmtDate(p.date))}</td><td>${esc(S.blocks[p.blockId]?.code || '')}</td><td class="small">${esc(p.variant)}</td><td class="small">${esc(p.sets.map((x) => setLabel(S.progEx, x) + ' × ' + (nl(x.reps, 0) || '?') + effTxt(x)).join('  ·  '))}</td><td class="num">${nl(p.bestP)}</td><td class="small">${p.reliable ? 'zwaar' : '<span class="muted">volume</span>'}</td></tr>`).join('')}</tbody></table></div></details>` : ''}`;
  }
  function drawProgress() {
    const el = $('#prog-chart'); if (!el || !S.progEx) return;
    const st = anchorStats(S.progEx); if (!st) return;
    const pts = st.pts, line = st.rel, W = Math.max(300, el.clientWidth), H = 260, m = { t: 22, r: 60, b: 26, l: 40 };
    const xs = pts.map((p) => toDate(p.date).getTime()), ys = pts.map((p) => p.bestP);
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 15; x1 += 864e5 * 15; }
    const pad = Math.max(2, (Math.max(...ys) - Math.min(...ys)) * 0.15); const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const X = (v) => m.l + ((v - x0) / (x1 - x0)) * (W - m.l - m.r), Y = (v) => H - m.b - ((v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const step = (y1 - y0) / 4; const ticks = [0, 1, 2, 3, 4].map((i) => y0 + i * step);
    const months = []; const dd = new Date(x0); dd.setDate(1); dd.setMonth(dd.getMonth() + 1);
    const every = W < 520 ? 4 : 2; let k = 0;
    while (dd.getTime() <= x1) { if (k % every === 0) months.push(new Date(dd)); dd.setMonth(dd.getMonth() + 1); k++; }
    const TX = (p) => X(toDate(p.date).getTime());
    const path = line.map((p, i) => `${i ? 'L' : 'M'}${TX(p).toFixed(1)},${Y(p.bestP).toFixed(1)}`).join('');
    const last = line[line.length - 1];
    const tip = (p) => { const x = p.topP || {}; return `${fmtDate(p.date)}|${(S.blocks[p.blockId]?.code || '') + ' · ' + setLabel(S.progEx, x) + ' × ' + (nl(x.reps, 0) || '?') + effTxt(x)}|e1RM ${nl(p.bestP)} kg · ${p.reliable ? 'zware set' : 'volumeset, indicatief'}`; };
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Geschat 1RM over tijd">
      <text x="${m.l - 6}" y="10" text-anchor="end">kg</text>
      ${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(t)}" dy="0.32em" text-anchor="end">${nl(t, 0)}</text>`).join('')}
      ${months.map((d) => `<text x="${X(d.getTime())}" y="${H - 6}" text-anchor="middle">${esc(d.toLocaleDateString('nl-BE', { month: 'short', year: '2-digit' }))}</text>`).join('')}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(st.first)}" y2="${Y(st.first)}" stroke="var(--muted)" stroke-dasharray="3 4"/>
      <path d="${path}" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p) => { const col = phaseCol(p.phase); return p.reliable || st.onlyIndicative ? `<circle cx="${TX(p)}" cy="${Y(p.bestP)}" r="5.5" fill="${col}" stroke="var(--panel)" stroke-width="1.5" data-tip="${esc(tip(p))}" style="cursor:pointer"/>` : `<circle cx="${TX(p)}" cy="${Y(p.bestP)}" r="4.5" fill="var(--panel)" stroke="${col}" stroke-width="1.8" opacity=".8" data-tip="${esc(tip(p))}" style="cursor:pointer"/>`; }).join('')}
      <text x="${TX(last) + 9}" y="${Y(last.bestP)}" dy="0.32em" style="fill:var(--ink);font-weight:600">${nl(last.bestP, 0)} kg</text></svg><div class="tip" hidden></div>`;
  }
  // ---------- view: history ----------
  function viewHistory() {
    const c = client(), bl = sortedBlocks().slice().reverse(), ss = sortedSessions().slice().reverse(), cur = blockFor(todayStr());
    const cnt = (id) => ss.filter((s) => s.blockId === id).length;
    return `<section class="card"><div class="card-h"><div><h2>Periodes</h2><p class="sub">Alle periodes, ook afgesloten. Klik om een periode te openen.</p></div></div>
      ${bl.length ? `<div class="tablewrap"><table><thead><tr><th>Periode</th><th>Fase</th><th>Start</th><th class="num">Weken</th><th class="num">Per week</th><th>Reps</th><th class="num">Trainingen</th></tr></thead><tbody>${bl.map((b) => `<tr class="click" data-act="open-block" data-id="${esc(b.id)}"><td><b style="font-weight:600">${esc(b.code)}</b>${cur && b.id === cur.id ? ' <span class="pill acc">nu</span>' : ''}</td><td><i class="dot" style="background:${phaseCol(b.phase)}"></i> ${esc(phaseOf(b.phase))}</td><td>${esc(fmtDate(b.start))}</td><td class="num">${blockWeeks(b)}</td><td class="num">${(b.exercises || []).length ? slotsOf(b).length : ''}</td><td>${esc(b.reps || '')}</td><td class="num">${cnt(b.id)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nog geen periodes.</div>'}</section>
      <section class="card"><div class="card-h"><div><h2>Logboek</h2><p class="sub">Alle trainingen. Oude schema's zijn enkel als topsets ingeladen (week "top").</p></div></div>
      ${ss.length ? `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Periode</th><th>Week</th><th>Training</th><th>Oefeningen</th><th class="num">Gewicht</th>${tracks(c, 'attention') ? `<th class="num">${ATT}</th>` : ''}${tracks(c, 'whoop') ? '<th class="num">Whoop</th>' : ''}<th>Rapport</th></tr></thead><tbody>${ss.map((s) => `<tr class="click" data-act="open-session" data-id="${esc(s.id)}"><td>${esc(fmtDate(s.date))}</td><td>${esc(S.blocks[s.blockId]?.code || '')}</td><td>${s.historical ? 'top' : esc(s.week)}</td><td>${s.historical ? '' : esc(slotShort(sessSlot(s)))}</td><td class="small">${(s.entries || []).map((e) => esc(exName(e.exId))).join(', ')}</td><td class="num">${nl(s.feedback?.bodyweight)}</td>${tracks(c, 'attention') ? `<td class="num">${nl(s.feedback?.pain, 0)}</td>` : ''}${tracks(c, 'whoop') ? `<td class="num">${s.feedback?.whoop != null && s.feedback?.whoop !== '' ? nl(s.feedback.whoop, 0) + '%' : ''}</td>` : ''}<td class="small">${s.report?.at ? '<span class="sig-up">✓</span> ' + esc(fmtDate(s.report.at.slice(0, 10), false)) : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nog geen trainingen.</div>'}</section>`;
  }

      </tbody></table></div></section>`;

  // ---------- actions ----------
  const setView = (v) => { if (!S.intakeDraft?.dirty) S.intakeDraft = null; if (!S.settingsDraft?.dirty) S.settingsDraft = null; S.view = v; store.set('ec.view', v); render(); window.scrollTo({ top: 0 }); };
  const ACT = {

    'set-reset': () => { S.settingsDraft = null; render(); },
    'set-save': async () => {

      const kpb = num(d.kgPerBlock) ?? 6.4, ppt = num(d.pullPushTarget) ?? 2, ppc = !!d.pullPushConfirmed;
      if (await write('config/app', { coaches, anchors: d.anchors, kgPerBlock: kpb, pullPushTarget: ppt, pullPushConfirmed: ppc })) { S.settingsDraft = null; S.config = { coaches, anchors: d.anchors, kgPerBlock: kpb, pullPushTarget: ppt, pullPushConfirmed: ppc }; toastMsg('Instellingen opgeslagen'); render(); }
    },
    'cf-cancel': () => { S.newClient = null; S.profileDraft = null; render(); },
    'cf-save': async () => {
      const d = S.newClient || S.profileDraft; if (!d.name?.trim()) { toastMsg('Geef de klant een naam.'); return; }
      const body = { name: d.name.trim(), email: (d.email || '').trim(), coach: d.coach || '', goal: d.goal || '', constraints: d.constraints || '', trainingDays: d.trainingDays || '', perWeek: num(d.perWeek) ?? 2, bodyweight: num(d.bodyweight), trackAttention: !!d.trackAttention, trackWhoop: !!d.trackWhoop, anchorsNA: d.anchorsNA || [] };
      if (S.newClient) {
        let id = slug(body.name); if (S.clients[id]) id = id + '-' + Math.random().toString(36).slice(2, 5);
        if (await write(`clients/${id}`, { ...body, event: null, stats: { sessionCount: 0 }, createdAt: todayStr() })) { S.newClient = null; toastMsg('Klant aangemaakt'); selectClient(id, 'overview'); }
      } else if (await write(`clients/${S.cid}`, body, true)) { S.profileDraft = null; toastMsg('Profiel opgeslagen'); render(); }
    },
    'goto-progress': (b) => { S.progEx = b.dataset.id; setView('progress'); },
    'open-session': async (b) => { const s = S.sessions[b.dataset.id]; if (!s) return; await savePlan(); S.saveState = ''; S.draft = clone({ ...s, day: sessSlot(s), feedback: s.feedback || {} }); S.draft.entries.forEach((en) => (en.sets || []).forEach((x) => { if (num(x.rpe) == null && num(x.rir) != null) x.rpe = rirToRpe(x.rir); })); S.draft.entries.forEach((en) => { if (unitOf(en.exId) === 'bw') { en.bwMode = 'extra'; en.sets.forEach((x) => { x.mode = 'extra'; }); } }); S.view = 'training'; store.set('ec.view', 'training'); render(); window.scrollTo({ top: 0 }); },
    'start-slot': (b) => { const date = $('#nt-date')?.value || todayStr(); S.trainDate = ''; S.saveState = ''; S.draft = newDraft(date, S.trainBlock, b.dataset.slot); renderMain(); window.scrollTo({ top: 0 }); },
    'open-block': (b) => { S.blockSel = b.dataset.id; S.schemaDraft = null; S.schemaDirty = false; S.slotFilter = ''; setView('planning'); },
    'slot-filter': (b) => { S.slotFilter = b.dataset.v; renderMain(); },

    'del-entry': (b) => { S.draft.entries.splice(+b.dataset.ei, 1); renderMain(); scheduleTraining(); },

    'copy-plan': (b) => {
      const en = S.draft.entries[+b.dataset.ei], plan = en.target?.setPlan || [], kpb = kgPerBlock();
      en.sets = plan.map((p) => { const kg = num(p.kg); if (unitOf(en.exId) === 'blok' && kg != null) { const bl = Math.floor(kg / kpb); return { blocks: bl, extra: round05(kg - bl * kpb) || '', reps: p.reps ?? '' }; } return { kg: kg ?? '', reps: p.reps ?? '', mode: en.bwMode || 'auto' }; });
      if (!en.sets.length) en.sets = [{ mode: en.bwMode || 'auto' }];
      renderMain(); scheduleTraining();
    },
    'del-session': () => ask('Training verwijderen?', `De training van ${fmtDate(S.draft.date)} en alle sets verdwijnen definitief.`, async () => { clearTimeout(S.saveTimer); if (S.draft.id && await remove(`clients/${S.cid}/sessions/${S.draft.id}`)) { S.draft = null; toastMsg('Training verwijderd'); render(); } }),
    'sel-block': async (b) => { await savePlan(); S.blockSel = b.dataset.id; S.schemaDraft = null; S.schemaDirty = false; S.slotFilter = ''; renderMain(); },
    'add-brow': (b) => {
      const d = S.schemaDraft; d.exercises = d.exercises || []; const ex = d.exercises;
      const day = b.dataset.slot || 'T1', rk = b.dataset.rk || 'A', used = ex.filter((r) => r.day === day).map((r) => r.code);
      let i = 1; while (used.includes(rk + i)) i++;
      const pd = PHASE_DEF[phaseOf(d.phase)] || PHASE_DEF.Accumulatie, [rmin, rmax] = String(d.reps || '').split('-').map(num);
      const ref = ex.find((r) => reeksOf(r.code) === rk) || {};
      const isF = rk === 'F', isC = rk === 'C';
      const row = { day, code: rk + i, exId: '', variant: '', method: isF ? '' : DEF_METHOD, sets: ref.sets ?? (isF ? 1 : rk === 'A' ? 5 : rk === 'B' ? 4 : 3), repsMin: isF ? null : ref.repsMin ?? (rmin ?? pd.repsMin) + (isC ? 2 : 0), repsMax: isF ? null : ref.repsMax ?? (rmax ?? pd.repsMax) + (isC ? 2 : 0), tempo: isF ? '' : ref.tempo ?? pd.tempo, rest: isF ? null : ref.rest ?? restFor(d.phase, rk), rir: isF ? null : ref.rir ?? pd.rir, note: '', filler: '', warmup: [] };
      row.setPlan = methodPlan(row); ex.push(row); markSchemaDirty(); renderMain();
    },
    'gen-slot': (b) => {
      const d = S.schemaDraft, slot = b.dataset.slot, idx = SLOTS.indexOf(slot), pd = PHASE_DEF[phaseOf(d.phase)] || PHASE_DEF.Accumulatie, [rmin, rmax] = String(d.reps || '').split('-').map(num);
      const ref = slotsOf(d).find((sl) => sl !== slot && d.exercises.some((r) => r.day === sl));
      const cnt = (rk) => (ref ? d.exercises.filter((r) => r.day === ref && reeksOf(r.code) === rk).length : rk === 'F' ? 1 : 2);
      const setsOf = (rk, def) => (ref ? num(d.exercises.find((r) => r.day === ref && reeksOf(r.code) === rk)?.sets) : null) || def;
      const g = { phase: phaseOf(d.phase), perWeek: idx + 1, repsMin: rmin ?? pd.repsMin, repsMax: rmax ?? pd.repsMax, rir: pd.rir, nA: cnt('A'), nB: cnt('B'), nC: cnt('C'), nF: cnt('F'), setsA: setsOf('A', 5), setsB: setsOf('B', 4), setsC: setsOf('C', 3) };
      d.exercises.push(...genProposal(g, [idx], d.exercises.map((r) => r.exId)));

    'bwu-add': (b) => { const r = S.schemaDraft.exercises[+b.dataset.ri]; r.warmup = r.warmup || []; const l = r.warmup[r.warmup.length - 1]; r.warmup.push({ kg: '', reps: l ? Math.max(1, Math.round((num(l.reps) || 2) / 2)) : '' }); r.warmupAuto = false; markSchemaDirty(); renderMain(); },
    'bwu-del': (b) => { const r = S.schemaDraft.exercises[+b.dataset.ri]; r.warmup.splice(+b.dataset.wi, 1); r.warmupAuto = false; markSchemaDirty(); renderMain(); },
    'bwu-auto': (b) => { const r = S.schemaDraft.exercises[+b.dataset.ri]; const w = warmupPlan(r); if (!w.length) { toastMsg(['A', 'B'].includes(reeksOf(r.code)) ? 'Vul eerst het gewicht per set in.' : 'Opwarmsets worden voorgesteld voor de A- en B-reeks.'); return; } r.warmup = w; r.warmupAuto = true; markSchemaDirty(); renderMain(); },
    'wset-add': (b) => { const en = S.draft.entries[+b.dataset.ei]; en.warmup = en.warmup || []; en.warmup.push({ kg: '', reps: '' }); renderMain(); },
    'wset-del': (b) => { const en = S.draft.entries[+b.dataset.ei]; en.warmup.splice(+b.dataset.wi, 1); renderMain(); scheduleTraining(); },
    'rep-open': async () => { if (!(await saveTraining()) || !S.draft?.id) { toastMsg('Log eerst minstens één set.'); return; } openReport(S.draft.id); },
    'rep-close': () => { S.report = null; renderReport(); },
    'rep-dl': () => reportDownload(),
    'rep-gmail': () => reportGmail(),
    'new-event': () => { S.eventDraft = { name: '', date: '', division: '', place: '', stations: [] }; S.eventDirty = true; renderMain(); },
    'add-station': () => { S.eventDraft.stations = S.eventDraft.stations || []; S.eventDraft.stations.push({ name: '', req: '', status: 'Nieuw' }); S.eventDirty = true; renderMain(); },
    'del-station': (b) => { S.eventDraft.stations.splice(+b.dataset.i, 1); S.eventDirty = true; renderMain(); },
    'reset-event': () => { S.eventDraft = null; S.eventDirty = false; render(); },
    'save-event': async () => { const d = clone(S.eventDraft); if (!d.name || !d.date) { toastMsg('Geef het event een naam en datum.'); return; } (d.stations || []).forEach((s) => { s.raceKg = num(s.raceKg); s.trainKg = num(s.trainKg); }); if (await write(`clients/${S.cid}`, { event: d }, true)) { S.eventDirty = false; S.eventDraft = null; toastMsg('Event opgeslagen'); render(); } },
    'close-event': () => ask('Event afsluiten?', 'Het event en de stations verdwijnen uit het profiel. Trainingen en progressie blijven bewaard.', async () => { if (await write(`clients/${S.cid}`, { event: null }, true)) { S.eventDraft = null; S.eventDirty = false; toastMsg('Event afgesloten'); render(); } }, 'Afsluiten'),
    'ex-new': () => { S.exNew = { name: '', type: 'kracht', category: 'Borst', secondary: [], unit: 'kg', note: '' }; renderMain(); $('#ex-name')?.focus(); },
    'ex-edit': (b) => { S.exEdit = clone(S.exercises[b.dataset.id]); renderMain(); },
    'ex-cancel': () => { S.exNew = null; S.exEdit = null; render(); },
    'ex-save': async () => {
      const d = S.exNew || S.exEdit; if (!d.name?.trim()) { toastMsg('Geef de oefening een naam.'); return; }
      const units = (d.type || exType(d)) === 'conditie' ? UNITS_C : UNITS_K; const unit = units.some((u) => u[0] === d.unit) ? d.unit : units[0][0];
      const body = { name: d.name.trim(), type: (d.type || exType(d)), category: d.category, secondary: [...new Set((d.secondary || []).filter((x) => x && x !== d.category))], unit, pattern: d.pattern || '', note: d.note || '' };
      if (S.exNew) { if (Object.values(S.exercises).some((e) => e.name.toLowerCase() === body.name.toLowerCase())) { toastMsg('Deze oefening bestaat al.'); return; } let id = slug(body.name); if (S.exercises[id]) id += '-' + Math.random().toString(36).slice(2, 5); if (await write(`exercises/${id}`, body)) { S.exNew = null; toastMsg('Oefening toegevoegd'); render(); } }
      else if (await write(`exercises/${d.id}`, body, true)) { S.exEdit = null; toastMsg('Oefening opgeslagen'); render(); }
    },
    'confirm-no': () => { S.confirm = null; renderOverlay(); },
    'confirm-yes': async () => { const fn = S.confirm?.fn; S.confirm = null; renderOverlay(); if (fn) await fn(); },
  };
  function ask(title, text, fn, yes) { S.confirm = { title, text, fn, yes }; renderOverlay(); }
  function blocking() { return S.profileDraft || S.newClient || (S.view === 'event' && S.eventDirty) || S.exEdit || S.exNew || (S.view === 'intake' && S.intakeDraft?.dirty) || (S.view === 'settings' && S.settingsDraft?.dirty); }
  function confirmLeave() { toastMsg('Sla eerst op of annuleer je wijzigingen.'); return false; }
  async function selectClient(id, view) {
    if (blocking()) { confirmLeave(); renderHeader(); return; }
    await flushAll();
    S.cid = id || null; store.set('ec.cid', S.cid); S.draft = null; S.schemaDraft = null; S.blockSel = null; S.gen = null; S.trainBlock = null; S.slotFilter = ''; S.progEx = null; S.eventDraft = null; S.intakeDraft = null;
    S.view = id ? (view || (S.view === 'home' ? 'overview' : S.view)) : 'home'; store.set('ec.view', S.view);
    subscribeClient(S.cid); render();
  }

  // ---------- bindings ----------
  function onInput(e) {
    const t = e.target, b = t.dataset.bind; if (!b) return;
    if (['set', 'entry', 'bwmode', 'fb', 'meta', 'wset'].includes(b) && S.draft) setTimeout(scheduleTraining, 0);
    const v = t.type === 'checkbox' ? t.checked : t.value;
    if (b === 'set') {
      const ei = +t.dataset.ei, si = +t.dataset.si, en = S.draft.entries[ei]; en.sets[si][t.dataset.f] = v; if (t.dataset.f === 'rpe') en.sets[si].rir = rpeToRir(v) ?? '';
      if (unitOf(en.exId) === 'bw') { en.sets[si].mode = en.bwMode || 'auto'; const tc = $(`#tot-${ei}-${si}`), tot = setKg(en.sets[si], en.exId); if (tc) tc.textContent = tot != null ? nl(tot) + ' kg' : ''; }
      const c1 = $(`#e1-${ei}-${si}`), c2 = $(`#sg-${ei}-${si}`);
      if (c1) c1.textContent = isStrength(en.exId) ? nl(e1(en.sets[si], en.exId, en.target?.code)) : ''; if (c2) c2.innerHTML = sigHTML(en.sets[si], en.target);
    } else if (b === 'entry') S.draft.entries[+t.dataset.ei][t.dataset.f] = v;
    else if (b === 'bwmode') { const en = S.draft.entries[+t.dataset.ei]; en.bwMode = v; en.sets.forEach((x) => { x.mode = v; }); if (e.type === 'change') renderMain(); }
    else if (b === 'fb') S.draft.feedback[t.dataset.f] = v;
    else if (b === 'meta') { S.draft[t.dataset.f] = v; if (t.dataset.f === 'date' || t.dataset.f === 'blockId') { S.draft.week = weekFor(S.blocks[S.draft.blockId], S.draft.date); const w = $('#d-week'); if (w) w.value = S.draft.week; } }
    else if (b === 'cf') (S.newClient || S.profileDraft)[t.dataset.f] = v;
    else if (b === 'cf-flag') (S.newClient || S.profileDraft)[t.value] = t.checked;
    else if (b === 'cf-na') { const d = S.newClient || S.profileDraft; d.anchorsNA = d.anchorsNA || []; d.anchorsNA = t.checked ? [...new Set([...d.anchorsNA, t.value])] : d.anchorsNA.filter((x) => x !== t.value); }
    else if (b === 'intake') {
      const i = +t.dataset.i, r = S.intakeDraft.rows[i]; r[t.dataset.f] = v; S.intakeDraft.dirty = true;
      const rm = intakeCalc(r), c1 = $(`#it-${i}-rm`), c2 = $(`#it-${i}-pct`);
      if (c1) c1.innerHTML = rm != null ? `<b>${nl(rm)} kg</b>` : ''; if (c2) c2.textContent = num(r.reps) ? nl((pctTable(num(r.reps) + (num(r.rir) || 0)) || 0) * 100, 0) + '%' : '';
    }
    else if (b === 'intake-meta') { S.intakeDraft[t.dataset.f] = v; S.intakeDraft.dirty = true; }
    else if (b === 'set-kpb') { S.settingsDraft.kgPerBlock = v; markSettingsDirty(); }
    else if (b === 'coach') { S.settingsDraft.coaches[+t.dataset.i] = v; markSettingsDirty(); }
    else if (b === 'set-anchor') { const d = S.settingsDraft; d.anchors = t.checked ? [...new Set([...d.anchors, t.value])] : d.anchors.filter((x) => x !== t.value); markSettingsDirty(); }
    else if (b === 'exf-sec') { const d = S.exNew || S.exEdit; d.secondary = [...(d.secondary || [])]; d.secondary[+t.dataset.i] = v; }
    else if (b === 'bmeta') {
      const d = S.schemaDraft;
      if (t.dataset.f === 'perWeek' && e.type === 'change') {
        const n = num(v) || 1, drop = (d.exercises || []).filter((r) => SLOTS.indexOf(r.day) >= n);
        if (drop.length) { const names = [...new Set(drop.map((r) => slotLabel(r.day)))].join(', '); t.value = String(slotsOf(d).length); ask(`${names} schrappen?`, `${drop.length} oefeningen in ${names} verdwijnen uit deze periode.`, () => { d.perWeek = n; d.exercises = d.exercises.filter((r) => SLOTS.indexOf(r.day) < n); markSchemaDirty(); renderMain(); }, 'Schrappen'); return; }
        d.perWeek = n; markSchemaDirty(); renderMain(); return;
      }
      d[t.dataset.f] = v; markSchemaDirty();
    }
    else if (b === 'gen') { S.gen[t.dataset.f] = v; if (e.type === 'change' && t.dataset.f === 'phase') { applyPhase(S.gen, v); renderMain(); } else if (e.type === 'change' && t.dataset.f === 'volCut') { Object.assign(S.gen, { setsA: cutSets(5, v), setsB: cutSets(4, v), setsC: cutSets(3, v) }); renderMain(); } else if (e.type === 'change' && ['weeks', 'perWeek', 'repsMin', 'repsMax', 'methodA'].includes(t.dataset.f)) renderMain(); }
    else if (b === 'brow') {
      const r = S.schemaDraft.exercises[+t.dataset.ri]; r[t.dataset.f] = v; markSchemaDirty();
      if (e.type === 'change' && ['exId', 'code', 'sets', 'repsMin', 'repsMax', 'rir', 'method'].includes(t.dataset.f)) { if (t.dataset.f === 'method' && v === 'Tempo' && !r.tempo) r.tempo = '4010'; r.setPlan = methodPlan(r); if (r.warmupAuto !== false) r.warmup = warmupPlan(r); }
      if (e.type === 'change' && ['exId', 'code', 'day', 'sets', 'repsMin', 'repsMax', 'rir', 'method', 'tempo', 'rest'].includes(t.dataset.f)) renderMain();
    }
    else if (b === 'bwu') { const r = S.schemaDraft.exercises[+t.dataset.ri]; r.warmup[+t.dataset.wi][t.dataset.f] = v; r.warmupAuto = false; markSchemaDirty(); }
    else if (b === 'wset') { S.draft.entries[+t.dataset.ei].warmup[+t.dataset.wi][t.dataset.f] = v; }
    else if (b === 'rep') { if (S.report) S.report[t.dataset.f] = v; }
    else if (b === 'set-ppt') { S.settingsDraft.pullPushTarget = v; markSettingsDirty(); }
    else if (b === 'set-ppc') { S.settingsDraft.pullPushConfirmed = t.checked; markSettingsDirty(); }
    else if (b === 'splan') { const r = S.schemaDraft.exercises[+t.dataset.ri]; r.setPlan[+t.dataset.si][t.dataset.f] = v; markSchemaDirty(); }
    else if (b === 'ev') { S.eventDraft[t.dataset.f] = v; markEventDirty(); }
    else if (b === 'station') { S.eventDraft.stations[+t.dataset.i][t.dataset.f] = v; markEventDirty(); if (e.type === 'change') renderMain(); }
    else if (b === 'exf') { const d = S.exNew || S.exEdit; d[t.dataset.f] = v; if (t.dataset.f === 'type' && e.type === 'change') { d.unit = (v === 'conditie' ? UNITS_C : UNITS_K)[0][0]; renderMain(); } else if (e.type === 'change' && ['category', 'name', 'unit'].includes(t.dataset.f)) { const sel = $('#ex-pat'); if (sel && sel.options[0]) sel.options[0].textContent = 'Auto: ' + PAT_LABEL[autoPattern(d)]; } }
  }
  function markSchemaDirty() { S.schemaDirty = true; S.lastEdit = Date.now(); setSaveState('Wijzigingen worden bewaard…'); clearTimeout(S.planTimer); S.planTimer = setTimeout(savePlan, 1200); }
  function setSaveState(txt) { S.saveState = txt; const el = $('#save-state'); if (el) el.textContent = txt; }
  const hhmm = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  async function savePlan() {
    clearTimeout(S.planTimer); const d = S.schemaDraft; if (!d || !S.schemaDirty) return true;
    const { _unsaved, ...body } = clone(d); delete body.id; delete body.method;
    body.exercises = (body.exercises || []).map((r) => { const setPlan = (r.setPlan || []).map((p) => ({ kg: num(p.kg), reps: num(p.reps), note: p.note || '' })); return { ...r, warmup: (r.warmup || []).map((w) => ({ kg: num(w.kg), reps: num(w.reps) })).filter((w) => w.kg != null || w.reps != null), filler: r.filler || '', method: r.method || '', sets: num(r.sets), repsMin: num(r.repsMin), repsMax: num(r.repsMax), rest: num(r.rest), rir: num(r.rir), setPlan, startKg: setPlan[0]?.kg ?? null }; });
    body.intensity = num(body.intensity); body.weeks = num(body.weeks) || 3; body.perWeek = num(body.perWeek) || slotsOf(d).length;
    S.lastSelf = Date.now();
    if (await write(`clients/${S.cid}/blocks/${d.id}`, body)) { if (S.blocks[d.id]) delete S.blocks[d.id]._unsaved; if (S.schemaDraft === d) S.schemaDirty = false; setSaveState('Opgeslagen om ' + hhmm()); return true; }
    setSaveState('Niet opgeslagen: probeer opnieuw'); return false;
  }
  function trainingBody(d) {
    const entries = d.entries.filter((e) => e.exId).map((e) => ({ exId: e.exId, variant: e.variant || '', hard: String(e.hard || '').trim(), score: num(e.score) != null ? Math.min(10, Math.max(1, Math.round(num(e.score)))) : null, target: e.target || {}, warmup: (e.warmup || []).map((w) => ({ kg: num(w.kg), reps: num(w.reps) })).filter((w) => w.kg != null || w.reps != null), sets: e.sets.filter((x) => ['kg', 'blocks', 'reps', 'value', 'time'].some((f) => x[f] !== '' && x[f] != null)).map((x) => ({ kg: num(x.kg), blocks: num(x.blocks), extra: num(x.extra), reps: num(x.reps), rpe: num(x.rpe), rir: num(x.rpe) != null ? rpeToRir(x.rpe) : num(x.rir), value: num(x.value), time: x.time || '', ...(unitOf(e.exId) === 'bw' ? bwSave(x) : {}) })) })).filter((e) => e.sets.length);
    const fb = d.feedback || {};
    return { date: d.date, blockId: d.blockId, week: num(d.week) ?? 1, day: d.day || '', done: true, historical: !!d.historical, note: d.note || '', entries, feedback: { bodyweight: num(fb.bodyweight), whoop: num(fb.whoop), pain: num(fb.pain), energy: num(fb.energy), note: fb.note || '' }, report: d.report || null, updatedAt: new Date().toISOString() };
  }
  function scheduleTraining() { if (!S.draft) return; S.draft._dirty = true; setSaveState('Wordt bewaard…'); clearTimeout(S.saveTimer); S.saveTimer = setTimeout(saveTraining, 1200); }
  async function saveTraining() {
    clearTimeout(S.saveTimer); const d = S.draft; if (!d || !d._dirty) return true;
    const body = trainingBody(d); if (!body.entries.length && !d.id) { setSaveState('Nog niets ingevuld'); return true; }
    if (!d.id) d.id = uid('s');
    S.lastSelf = Date.now(); d._dirty = false;
    if (!(await write(`clients/${S.cid}/sessions/${d.id}`, body))) { d._dirty = true; setSaveState('Niet opgeslagen: probeer opnieuw'); return false; }
    const all = { ...S.sessions, [d.id]: { id: d.id, ...body } }, real = Object.values(all).filter((x) => !x.historical);
    const bwS = real.filter((x) => x.feedback?.bodyweight != null).sort((a, b) => (a.date < b.date ? -1 : 1)).pop();
    S.lastSelf = Date.now();
    await write(`clients/${S.cid}`, { stats: { sessionCount: real.length, lastSession: real.map((x) => x.date).sort().pop() || null, lastBodyweight: bwS?.feedback.bodyweight ?? null } }, true);
    setSaveState('Opgeslagen om ' + hhmm()); const del = $('[data-act="del-session"]'); if (del) del.hidden = false; const rb = $('[data-act="rep-open"]'); if (rb) rb.disabled = false; return true;
  }
  async function flushAll() { await saveTraining(); await savePlan(); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  window.addEventListener('pagehide', () => { flushAll(); });
  function markSettingsDirty() { if (!S.settingsDraft.dirty) { S.settingsDraft.dirty = true; const x = $('[data-act="set-reset"]'); if (x) x.disabled = false; } }
  function markEventDirty() { if (!S.eventDirty) { S.eventDirty = true; document.querySelectorAll('[data-act="save-event"],[data-act="reset-event"]').forEach((x) => (x.disabled = x.dataset.act === 'save-event' && !S.canWrite)); } }

  document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); } });
  document.addEventListener('input', onInput);
  document.addEventListener('change', (e) => {
    if (e.target.dataset.change === 'client') return selectClient(e.target.value);
    if (e.target.id === 'nt-block') { S.trainBlock = e.target.value; S.trainDate = $('#nt-date')?.value || ''; renderMain(); return; }
    if (e.target.id === 'nt-date') { S.trainDate = e.target.value; return; }
    if (e.target.dataset.bind) onInput(e);
  });
  document.addEventListener('mousemove', (e) => {
    const tip = $('#prog-chart .tip'); if (!tip) return;
    const c = e.target.closest('[data-tip]');
    if (!c) { tip.hidden = true; return; }
    const [a, b, d] = c.dataset.tip.split('|'); tip.innerHTML = `<div class="t">${esc(a)}</div><div>${esc(b)}</div><div><b>${esc(d)}</b></div>`; tip.hidden = false;
    const box = $('#prog-chart').getBoundingClientRect(); let x = e.clientX - box.left + 12; const y = e.clientY - box.top + 12;
    if (x + tip.offsetWidth > box.width - 6) x = e.clientX - box.left - tip.offsetWidth - 12;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.min(y, box.height - tip.offsetHeight - 4) + 'px';
  });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawProgress, 150); });

  // ---------- boot ----------
  async function boot() {
    const use = window.claude?.use;
    const db = use ? await window.claude.use('db') : null;
    if (!db) { S.offline = true; render(); return; }
    S.db = db;
    try { S.user = await window.claude.use('user'); const w = S.user ? await S.user.can('data.write') : null; if (w === false) S.canWrite = false; } catch {}
    db.collection('exercises').onSnapshot((snap) => { S.exercises = {}; snap.docs.forEach((d) => { S.exercises[d.id] = { id: d.id, ...d.data() }; }); S.loaded.ex = true; soft(); }, dbErr);
    db.collection('config').onSnapshot((snap) => {
      const d = snap.docs.find((x) => x.id === 'app')?.data() || {};
      S.config = { anchors: Array.isArray(d.anchors) ? d.anchors : DEFAULT_ANCHORS, coaches: Array.isArray(d.coaches) ? d.coaches : [], kgPerBlock: num(d.kgPerBlock) ?? 6.4, pullPushTarget: num(d.pullPushTarget) ?? 2, pullPushConfirmed: !!d.pullPushConfirmed }; soft();
    }, dbErr);
    db.collection('clients').onSnapshot((snap) => {
      S.clients = {}; snap.docs.forEach((d) => { S.clients[d.id] = { id: d.id, ...d.data() }; }); S.loaded.cl = true;
      if (S.cid && !S.clients[S.cid]) { S.cid = null; S.view = 'home'; subscribeClient(null); }
      soft();
    }, dbErr);
    if (S.cid) subscribeClient(S.cid); else S.view = ['exercises', 'settings'].includes(S.view) ? S.view : 'home';
  }
  boot();
})();
